name: Black-Week Deal-Bot

# GitHub startet zeitgesteuerte Workflows oft nur alle paar Stunden.
# Deshalb läuft jeder Start ~5,5 h und prüft darin alle 5 min.
# Die stündlichen Starts warten in der Warteschlange (concurrency) und übernehmen nahtlos.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["config.toml", "deal_bot.py"]   # nach Änderungen sofort neu starten

permissions:
  contents: write             # um state.json zurückzuschreiben
  actions: write              # um den nächsten Lauf selbst zu starten

concurrency:
  group: deal-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preise prüfen (Schleife, alle 5 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase || true            # Änderungen an config.toml übernehmen
            python3 deal_bot.py || echo "Lauf fehlgeschlagen, weiter geht's"
            git add state.json *.csv 2>/dev/null || git add state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "state update" && (git push -q || (git pull -q --rebase && git push -q)) || true
            fi
            sleep 300
          done
      - name: Nächsten Lauf starten (lückenlose Kette)
        if: ${{ !cancelled() }}    # bei manuellem Abbruch keine neue Runde
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deal-bot.yml --repo "${{ github.repository }}" --ref main
