# ======================================================= Regeln
# Statt fester Modelle: Kategorie + €/TB-Grenze (Mehrfachpacks werden pro Stück gerechnet)
#   all = alle Begriffe nötig · any = mind. einer · none = Ausschluss
#   max_eur_per_tb → 🛒 Deal · hot_eur_per_tb → 🚨 TOP-DEAL · max_price = absolute Grenze
# Reihenfolge zählt: die erste passende Regel gewinnt.

[[watch]]
label = "CFexpress Type B"
all = ["cfexpress"]
none = ["type a", "typ a", "type-a", "tipo a", "lecteur", "reader", "lesegerät", "lector", "lettore"]
max_eur_per_tb = 320      # Virtual Foto: 2× AV PRO SE 1 TB für 423 € ≈ 212 €/TB
hot_eur_per_tb = 250
alert_unknown = true      # auch melden, wenn Preis/Kapazität nicht im Titel steht

[[watch]]
label = "Portable SSD"
any = ["t7", "t9", "extreme portable", "extreme pro portable", "sandisk extreme", "crucial x9", "crucial x10", "lexar sl", "ssd externe", "ssd portable", "externe ssd", "portable ssd"]
none = ["microsd", "sd card", "sd-karte", "sdxc", "carte sd"]
max_eur_per_tb = 150
hot_eur_per_tb = 115

[[watch]]
label = "HDD Archiv/NAS"
any = ["ironwolf", "wd red", "n300", "exos", "ultrastar", "mg08", "mg09", "mg10", "wd elements", "seagate expansion", "my book", "toshiba canvio", "red plus", "red pro"]
max_eur_per_tb = 28
hot_eur_per_tb = 22

[[watch]]
label = "NAS-Gehäuse"
any = ["dxp2800", "dxp4800", "dxp480t", "ds225+", "ds224+", "ds425+", "ds923+", "ds423+", "ts-264", "ts-464", "as5402", "as5404"]
max_price = 450

[[watch]]
label = "Angelbird / Nextorage / ProGrade"
any = ["angelbird", "nextorage", "prograde", "delkin"]

[[watch]]
label = "Manfrotto ONE"
all = ["manfrotto", "one"]

[[watch]]
label = "Leatherman"
all = ["leatherman"]
max_price = 120

[[watch]]
label = "Licht"
any = ["amaran", "aputure", "godox ml", "nanlite", "zhiyun molus"]

[[watch]]
label = "Molton"
any = ["molton"]

# ======================================================= eBay (offizielle Browse API)
# Nur Neuware, Sofortkauf, Versand nach DE, Preis inkl. Versand.
# Die Bewertung wird anhand der passenden [[watch]]-Regel (rule = label) berechnet.
# Budget: Suchen × Marktplätze × 4/h × 24 muss unter 5.000 Abfragen/Tag bleiben (aktuell 6 × 4 × 96 = 2.304).
[ebay]
marketplaces = ["EBAY_DE", "EBAY_IT", "EBAY_FR", "EBAY_ES"]
deliver_to = "DE"
min_feedback_pct = 98.5        # Schutz vor Fake-/Betrugsangeboten (gefälschte Karten sind auf eBay häufig)
min_feedback_count = 200
max_alerts_per_search = 5

[[ebay.search]]
q = "cfexpress type b 1tb"
rule = "CFexpress Type B"
min_price = 120
max_price = 700

[[ebay.search]]
q = "(angelbird, nextorage, prograde) cfexpress"
rule = "CFexpress Type B"
min_price = 120
max_price = 900

[[ebay.search]]
q = "(samsung t7, samsung t9, sandisk extreme portable, crucial x9, crucial x10) 2tb"
rule = "Portable SSD"
min_price = 100
max_price = 400

[[ebay.search]]
q = "(samsung t7, samsung t9, sandisk extreme portable, crucial x9, crucial x10) 4tb"
rule = "Portable SSD"
min_price = 200
max_price = 700

[[ebay.search]]
q = "(ironwolf, wd red plus, seagate exos, toshiba n300, wd ultrastar) (12tb, 14tb, 16tb, 18tb, 20tb)"
rule = "HDD Archiv/NAS"
min_price = 150
max_price = 700

[[ebay.search]]
q = "(wd elements, seagate expansion, wd my book) (12tb, 14tb, 16tb, 18tb, 20tb)"
rule = "HDD Archiv/NAS"
min_price = 150
max_price = 700
