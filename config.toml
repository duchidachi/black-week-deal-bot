# Black-Week-Watchlist für deal_bot.py
# target  = "guter Deal"   → 🔥 Alarm
# buy_now = "sofort kaufen" → 🚨 Alarm
# Außerdem gibt es einen Alarm, wenn der Preis um drop_alert_pct unter den ersten gemessenen Preis fällt.

[settings]
run_every_min = 5         # muss zum Cron-Intervall passen
geizhals_every_min = 30   # Geizhals nur alle 30 min abfragen (höflich)
ebay_every_min = 15       # eBay-API alle 15 min (Limit 5.000 Abfragen/Tag)
delay_s = 4               # Pause zwischen Geizhals-Seiten
drop_alert_pct = 12

